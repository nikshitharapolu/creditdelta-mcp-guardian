[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditdelta-mcp"
version = "1.4.0"
description = "Evidence-backed SEC financial analysis with MCP security controls and grounded LLM reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Nikshitha Rapolu" }
]
keywords = [
  "mcp",
  "model-context-protocol",
  "security",
  "llm",
  "financial-analysis",
  "sec",
  "streamlit",
]

dependencies = [
  "mcp[cli]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "uv>=0.8,<1",
]
dashboard = [
  "streamlit>=1.50,<2",
  "google-genai>=1.0,<2",
]

[project.scripts]
creditdelta-mcp = "creditdelta_mcp.server:main"
creditdelta-benchmark = "creditdelta_mcp.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]